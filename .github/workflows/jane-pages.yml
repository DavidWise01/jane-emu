name: Jane EMU — Build, Artifact & Play
run-name: Jane EMU / publish playable Mission Control

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'releases/**'
      - 'dashboard/**'
      - 'rust/**'
      - 'tests/**'
      - 'docs/**'
      - 'data/phase2-progress.json'
      - 'data/phase3-progress.json'
      - 'data/phase4-progress.json'
      - 'data/phase5-progress.json'
      - 'data/phase6-progress.json'
      - 'data/phase7-progress.json'
      - 'data/phase7-freeze.json'
      - 'data/phase8-progress.json'
      - 'data/phase8-freeze.json'
      - 'data/phase9-progress.json'
      - 'data/phase9-freeze.json'
      - 'scripts/build_av174_pdf.py'
      - 'memory/curation/**'
      - '.github/workflows/jane-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jane-emu-pages
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package playable Jane
    runs-on: ubuntu-24.04
    outputs:
      entry: ${{ steps.verify.outputs.entry }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test Rust cortex
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test --locked --manifest-path rust/jane-cortex/Cargo.toml
          cargo build --locked --release --target wasm32-unknown-unknown --manifest-path rust/jane-cortex/Cargo.toml
          cp rust/jane-cortex/target/wasm32-unknown-unknown/release/jane_cortex.wasm dashboard/jane_cortex.wasm
          node tests/rust_cortex_wasm.test.cjs

      - name: Verify playable HTML and embedded JPG
        id: verify
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, os
          page = pathlib.Path('index.html')
          assert page.is_file(), 'Missing index.html'
          index = page.read_text(encoding='utf-8')
          match = re.search(r'url=\./(dashboard/arena\.html)', index)
          assert match, 'index.html must link to the current arcade'
          entry = pathlib.Path(match.group(1))
          assert entry.is_file(), f'Missing arcade: {entry}'
          content = entry.read_text(encoding='utf-8')
          assert 'id="game"' in content and 'JANE_SYNC' in content, 'Missing arcade or AV-138 synchronization'
          assert pathlib.Path('dashboard/av138_sync.js').is_file(), 'Missing AV-138 clock engine'
          # Legacy embedded-JPEG release is retained and checked independently.
          legacy = pathlib.Path('releases/Janes_Perception_v71_Mission_Control_Embedded_JPG_Story_NES.html')
          assert legacy.is_file() and 'data:image/jpeg;base64,' in legacy.read_text(encoding='utf-8'), 'Missing preserved embedded JPG release'
          print(f'Current arcade validated: {entry} ({entry.stat().st_size:,} bytes)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'entry={entry}', file=f)
          PY

      - name: Check AV-075 experiment policy
        run: node tests/test_av075_policy.cjs

      - name: Check AV-076 feedback closure
        run: node tests/test_av076_feedback.cjs

      - name: Check AV-077 prospective refinement
        run: node tests/test_av077_refinement.cjs

      - name: Verify AV-078 independent holdout gate
