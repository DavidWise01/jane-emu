name: Jane EMU — Build, Artifact & Play
run-name: Jane EMU / publish playable Mission Control

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'releases/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'docs/**'
      - 'data/phase2-progress.json'
      - 'data/phase3-progress.json'
      - 'data/phase4-progress.json'
      - 'data/phase5-progress.json'
      - 'data/phase6-progress.json'
      - 'scripts/build_av174_pdf.py'
      - 'memory/curation/**'
      - '.github/workflows/jane-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jane-emu-pages
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package playable Jane
    runs-on: ubuntu-24.04
    outputs:
      entry: ${{ steps.verify.outputs.entry }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify playable HTML and embedded JPG
        id: verify
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, os
          page = pathlib.Path('index.html')
          assert page.is_file(), 'Missing index.html'
          index = page.read_text(encoding='utf-8')
          match = re.search(r'url=\./(dashboard/arena\.html)', index)
          assert match, 'index.html must link to the current arcade'
          entry = pathlib.Path(match.group(1))
          assert entry.is_file(), f'Missing arcade: {entry}'
          content = entry.read_text(encoding='utf-8')
          assert 'id="game"' in content and 'JANE_SYNC' in content, 'Missing arcade or AV-138 synchronization'
          assert pathlib.Path('dashboard/av138_sync.js').is_file(), 'Missing AV-138 clock engine'
          # Legacy embedded-JPEG release is retained and checked independently.
          legacy = pathlib.Path('releases/Janes_Perception_v71_Mission_Control_Embedded_JPG_Story_NES.html')
          assert legacy.is_file() and 'data:image/jpeg;base64,' in legacy.read_text(encoding='utf-8'), 'Missing preserved embedded JPG release'
          print(f'Current arcade validated: {entry} ({entry.stat().st_size:,} bytes)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'entry={entry}', file=f)
          PY

      - name: Check AV-075 experiment policy
        run: node tests/test_av075_policy.cjs

      - name: Check AV-076 feedback closure
        run: node tests/test_av076_feedback.cjs

      - name: Check AV-077 prospective refinement
        run: node tests/test_av077_refinement.cjs

      - name: Verify AV-078 independent holdout gate
        run: node tests/test_av078_impact.cjs

      - name: Verify Jane Curator event ancestry
        run: python3 -m unittest discover -s tests -p 'test_jane_curator.py' -v

      - name: Verify Wizard three-player arena
        run: node tests/test_wizard_arena.cjs

      - name: Verify single-screen turn-taking arena
        run: node tests/test_turn_arena.cjs

      - name: Verify minimalist one-screen arena and NES speed controls
        run: node tests/test_arena_speed.cjs

      - name: Test AV-080 Jane–Toph teacher loop
        run: node tests/test_av080_coach.cjs

      - name: Verify AV-081 preregistered teaching effect
        run: node tests/test_av081_effect.cjs

      - name: Test AV-138 synchronization
        run: node tests/av138_sync.test.cjs

      - name: Test AV-139 phase-lock timing
        run: node tests/av139_phase_lock.test.cjs

      - name: Test AV-140 resonance lineage
        run: node tests/av140_resonance.test.cjs

      - name: Test AV-141 cross-root coherence
        run: node tests/av141_coherence.test.cjs

      - name: Test AV-142 reversible plasticity
        run: node tests/av142_plasticity.test.cjs

      - name: Test AV-143 adaptation with independent live roots
        run: node tests/av143_adaptation.test.cjs

      - name: Test AV-144 append-only reconsolidation
        run: node tests/av144_reconsolidation.test.cjs

      - name: Test AV-145 learning eligibility
        run: node tests/av145_metaplasticity.test.cjs

      - name: Test AV-146 criticality and sandbox eligibility
        run: node tests/av146_criticality.test.cjs

      - name: Test AV-147 developmental trajectory
        run: node tests/av147_homeorhesis.test.cjs

      - name: Test AV-148 allostatic preflight budget
        run: node tests/av148_allostasis.test.cjs

      - name: Test AV-149 three-fork forecast
        run: node tests/av149_anticipation.test.cjs

      - name: Test AV-150 predictive calibration and immutable history
        run: node tests/av150_predictive_homeostasis.test.cjs

      - name: Test AV-151 sensory predictive coding
        run: node tests/av151_predictive_coding.test.cjs

      - name: Test AV-152 cross-root surprise regulation
        run: node tests/av152_surprise.test.cjs

      - name: Test AV-153 bounded attention queue
        run: node tests/av153_attention.test.cjs

      - name: Test AV-154 dual-role attention routing
        run: node tests/av154_attention_routing.test.cjs

      - name: Test AV-155 cross-root persistence and settling
        run: node tests/av155_attention_persistence.test.cjs

      - name: Test AV-156 habituation and renewed attention
        run: node tests/av156_habituation.test.cjs

      - name: Test AV-157 bounded sensitization and recovery
        run: node tests/av157_sensitization.test.cjs

      - name: Test AV-158 neural equilibrium and bounded gain
        run: node tests/av158_equilibrium.test.cjs

      - name: Test AV-159 selective 48-feature attribution
        run: node tests/av159_selective_attention.test.cjs

      - name: Test AV-160 empirical feature-to-screen association
        run: node tests/av160_spatial_attention.test.cjs

      - name: Test AV-161 motion continuity and scene-change rejection
        run: node tests/av161_motion_continuity.test.cjs

      - name: Test AV-162 bounded motion permanence
        run: node tests/av162_object_permanence.test.cjs

      - name: Test AV-163 prospective trajectory prediction
        run: node tests/av163_motion_prediction.test.cjs

      - name: Test AV-164 predictive tracking and root-wise calibration
        run: node tests/av164_predictive_tracking.test.cjs

      - name: Test AV-165 three-model prospective motion comparison
        run: node tests/av165_adaptive_motion.test.cjs

      - name: Test AV-166 unseen-root motion generalization
        run: node tests/av166_motion_generalization.test.cjs

      - name: Test AV-167 prospective cross-ROM motion transfer
        run: node tests/av167_motion_transfer.test.cjs

      - name: Test AV-168 transfer failure diagnosis and conservative fallback
        run: node tests/av168_transfer_diagnosis.test.cjs

      - name: Test AV-169 target-root recovery and conservative reinstatement
        run: node tests/av169_transfer_recovery.test.cjs

      - name: Test AV-170 root-wise recovery hysteresis
        run: node tests/av170_recovery_stability.test.cjs

      - name: Test AV-171 confidence-weighted recovery intervals
        run: node tests/av171_confidence_recovery.test.cjs

      - name: Verify NES startup and every dashboard script syntax
        run: node tests/test_nes_startup_preflight.cjs

      - name: Test AV-172 distribution-shift confidence holdout
        run: node tests/av172_shift_confidence.test.cjs

      - name: Test AV-175 read-only playability recorder
        run: node tests/av175_playability.test.cjs

      - name: Test AV-176 screen-transition detector
        run: node tests/av176_transitions.test.cjs

      - name: Test AV-177 motion-aware scene detector
        run: node tests/av177_motion_scenes.test.cjs

      - name: Test AV-178 deterministic bounded START gate
        run: node tests/av178_start_gate.test.cjs

      - name: Test AV-179 gameplay idle and stall classifier
        run: node tests/av179_playstate.test.cjs

      - name: Test AV-180 deterministic best-action arbitration
        run: node tests/av180_best_action.test.cjs

      - name: Test AV-181 bounded defeat recovery
        run: node tests/av181_recovery.test.cjs

      - name: Test AV-182 three-player handoff continuity
        run: node tests/av182_handoff.test.cjs

      - name: Test AV-183 continuous-play endurance
        run: node tests/av183_endurance.test.cjs

      - name: Test AV-184 integration evidence and fail-closed freeze
        run: node tests/av184_integration.test.cjs

      - name: Test AV-185 ROM boot and executed START evidence
        run: node tests/av185_boot_start.test.cjs

      - name: Test AV-186 three-tool arcade consolidation
        run: node tests/av186_three_tools.test.cjs

      - name: Test AV-187 full three-player rotation
        run: node tests/av187_rotation.test.cjs

      - name: Test AV-188 full integration and fail-closed phase freeze
        run: node tests/av188_acceptance.test.cjs

      - name: Test AV-189 original NES fallback and runtime diagnostics
        run: node tests/av189_runtime.test.cjs

      - name: Test AV-190 authoritative NES gameplay mechanics
        run: node tests/av190_gameplay.test.cjs

      - name: Test AV-191 NES goal feedback and stall avoidance
        run: node tests/av191_goals.test.cjs

      - name: Test AV-192 bounded NES gameplay input timing
        run: node tests/av192_timing.test.cjs

      - name: Test AV-193 original NES controller cartridge via 6502 harness
        run: node tests/av193_controller_rom.test.cjs

      - name: Test AV-193 cartridge inside actual JSNES emulation core
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-jsnes" jsnes@2.1.0
          NODE_PATH="$RUNNER_TEMP/jane-jsnes/node_modules" node tests/av193_jsnes_playback.test.cjs

      - name: Test AV-194 visible sprite and movement in actual JSNES PPU framebuffer
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-jsnes" jsnes@2.1.0
          NODE_PATH="$RUNNER_TEMP/jane-jsnes/node_modules" node tests/av194_jsnes_framebuffer.test.cjs

      - name: Test AV-195 Chromium arcade ROM START and continuous handoff
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av195_arcade_browser.test.cjs

      - name: Test AV-196 visible Chromium NES canvas and full player rotation
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av196_canvas_rotation_browser.test.cjs

      - name: Diagnose AV-197 production keyboard movement in Chromium
        continue-on-error: true # Known AV-196 blocker; keep Pages publishing independent.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av197_keyboard_movement_browser.test.cjs

      - name: Diagnose AV-198 production A/B game actions in Chromium
        continue-on-error: true # Do not count this unresolved diagnostic as a passed gate.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av198_production_ab_browser.test.cjs

      - name: Diagnose AV-199 focused held-key input and release in Chromium
        continue-on-error: true # Accept only an independently verified passing browser run.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av199_keyboard_release_browser.test.cjs

      - name: Test AV-200 fail-closed defeat and restart policy
        shell: bash
        run: node tests/av200_defeat_restart.test.cjs

      - name: Test AV-201 real 6502 loss and restart in JSNES
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-jsnes" jsnes@2.1.0
          NODE_PATH="$RUNNER_TEMP/jane-jsnes/node_modules" node tests/av201_jsnes_defeat_restart.test.cjs

      - name: Diagnose AV-201 Chromium loss and restart through one NES
        continue-on-error: true # Require a real passing hosted-browser gate before acceptance credit.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av201_browser_defeat_restart.test.cjs

      - name: Diagnose AV-202 real game-over three-owner rotation in Chromium
        continue-on-error: true # Do not award acceptance until browser test passes.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av202_real_defeat_rotation_browser.test.cjs

      - name: Diagnose AV-203 unassisted three-loss NES endurance in Chromium
        continue-on-error: true # Not gameplay-accepted until a real browser run passes.
        shell: bash
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/jane-browser" playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" "$RUNNER_TEMP/jane-browser/node_modules/.bin/playwright" install chromium
          NODE_PATH="$RUNNER_TEMP/jane-browser/node_modules" PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers" node tests/av203_unassisted_endurance_browser.test.cjs

      - name: Verify AV-204 three distinct recovery episodes and stale START rejection
        run: node tests/av204_multi_cycle_recovery.test.cjs

      - name: Build AV-174 PDF evidence report
        run: |
          python3 -m pip install --disable-pip-version-check reportlab
          python3 scripts/build_av174_pdf.py
          test -s docs/AV-174-playability-verification.pdf

      - name: Assemble offline-playable web artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R releases _site/releases
          cp -R dashboard _site/dashboard
          mkdir -p _site/docs
          cp docs/AV-174-playability-verification.md docs/AV-174-playability-verification.pdf docs/PHASE-2-AV177-184.md docs/PHASE-3-AV185-188.md docs/PHASE-4-AV189-192.md docs/PHASE-5-AV193-196.md docs/PHASE-6-AV197-204.md _site/docs/
          mkdir -p _site/data
          cp data/phase2-progress.json _site/data/phase2-progress.json
          cp data/phase3-progress.json _site/data/phase3-progress.json
          cp data/phase4-progress.json _site/data/phase4-progress.json
          cp data/phase5-progress.json _site/data/phase5-progress.json
          cp data/phase6-progress.json _site/data/phase6-progress.json
          if [ -d memory/curation ]; then mkdir -p _site/memory; cp -R memory/curation _site/memory/curation; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          printf 'Jane EMU release: %s\nCommit: %s\n' '${{ steps.verify.outputs.entry }}' "$GITHUB_SHA" > _site/BUILD.txt
          find _site -maxdepth 2 -type f -printf '%p (%s bytes)\n'

      - name: Upload downloadable play artifact
        uses: actions/upload-artifact@v4
        with:
          name: jane-emu-playable
          path: _site/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Deploy live Jane
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show live game URL
        shell: bash
        run: |
          echo "Play Jane at: ${{ steps.deployment.outputs.page_url }}"
          echo "Playable release: ${{ needs.package.outputs.entry }}"
