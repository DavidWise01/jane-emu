name: Jane Memory Agent — Evidence Pool
on:
  workflow_dispatch:
    inputs:
      observation_json:
        description: 'Optional public, non-sensitive evidence JSON (schema documented in memory/README.md)'
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'memory/inbox/**'
      - 'agent/**'
      - '.github/workflows/jane-memory.yml'

permissions:
  contents: write

concurrency:
  group: jane-memory-main
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify evidence rules
        run: python3 -m unittest discover -s tests -p 'test_jane_agent.py' -v

      - name: Observe repository and ingest public evidence
        env:
          JANE_OBSERVATION_JSON: ${{ inputs.observation_json }}
        run: python3 agent/jane_agent.py

      - name: Commit only changed derived pool records
        shell: bash
        run: |
          git config user.name "jane-evidence-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/pool/
          if git diff --cached --quiet; then
            echo "Jane memory unchanged; no commit."
            exit 0
          fi
          git commit -m "memory: append Jane evidence events and rebuild index [skip ci]"
          git push origin HEAD:main
